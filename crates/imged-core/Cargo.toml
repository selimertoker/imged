[package]
name = "imged-core"
description = "Headless image-editing core for imged: pixel storage, layers, history and operations. No GUI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon = "1.12"
ab_glyph = "0.2"
fontdb = "0.24"
image = { version = "0.25", default-features = true }
ag-psd = "0.3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HEIC/HEIF through the system libheif (needs libheif-dev to build).
libheif-rs = { version = "3", default-features = false, features = ["v1_17"], optional = true }
# JPEG XL: pure-Rust decoder and (lossless) encoder.
jxl-oxide = { version = "0.12", optional = true }
zune-jpegxl = { version = "0.5", optional = true }
zune-core = { version = "0.5", optional = true }
# Whiteboard stitching (feature matching, homographies, optical flow) through
# the system OpenCV (needs OpenCV 4.5 or newer with development files, and libclang, to build).
opencv = { version = "0.102", default-features = false, features = ["calib3d", "features2d", "imgproc", "video", "flann"], optional = true }

[features]
default = ["heif", "jxl"]
heif = ["dep:libheif-rs"]
jxl = ["dep:jxl-oxide", "dep:zune-jpegxl", "dep:zune-core"]
# AVIF decoding through libdav1d (needs the system library and pkg-config).
avif-decode = ["image/avif-native"]
# The Stitch tool's automatic alignment (system OpenCV).
stitch = ["dep:opencv"]

[[example]]
name = "stitch"
required-features = ["stitch"]
